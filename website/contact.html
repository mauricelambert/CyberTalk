<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Sylphora Dynamics</title>
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      margin: 0;
      background: #0b1220;
      color: #eaf2ff;
      padding: 28px;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    h1 {
      margin: 0 0 8px 0;
    }

    .muted {
      color: #9fb0c9;
    }

    dl {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 8px 18px;
      margin-top: 12px;
    }

    code {
      background: rgba(255, 255, 255, 0.02);
      padding: 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
    }

    .note {
      margin-top: 14px;
      color: #ffd6d6;
      background: rgba(255, 90, 90, 0.04);
      padding: 10px;
      border-radius: 8px;
    }

    /* Styles ajoutés pour l'en-tête */
    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background-color: #003366;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    header .logo {
      font-size: 36px;
      font-weight: bold;
      color: white;
      background-color: #005bb5;
      padding: 8px 15px;
      border-radius: 50%;
      text-transform: uppercase;
      margin-right: 15px;
    }

    header h1 {
      font-size: 24px;
      margin: 0;
      color: white;
    }

    header .tagline {
      font-size: 16px;
      color: #c4d0e0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden>SD</div>
      <div>
        <h1>Sylphora Dynamics</h1>
        <div class="tagline">Orchestrer le flux, sans effort</div>
      </div>
    </header>
    <div class="card">
      <h1>Contact</h1>
      <div class="muted">Sylphora Dynamics</div>

      <dl>
        <dt>Email général</dt><dd><code>contact@sylphora-dynamics.test</code></dd>
        <dt>Support</dt><dd><code>support@sylphora-dynamics.test</code></dd>
        <dt>RH</dt><dd><code>hr@sylphora-dynamics.test</code></dd>
        <dt>CEO</dt><dd><code>henri.brosquet@sylphora-dynamics.test</code></dd>
      </dl>
    </div>
  </div>
</body>
</html>
