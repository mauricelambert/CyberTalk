<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vérification 2FA — Sylphora Dynamics</title>
  <style>
    :root {
      --bg: #071022;
      --card: #07172a;
      --accent: #37b2ff;
      --muted: #9fb6d0;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: linear-gradient(180deg, #061122, #071a30);
      color: #eaf6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding: 22px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.03);
      box-shadow: 0 12px 40px rgba(3,9,20,0.65);
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1f6fb0, #2dd0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: 1.2rem;
    }
    p.hint {
      color: var(--muted);
      margin-top: 8px;
    }
    form {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }
    label {
      font-size: 0.9rem;
      color: var(--muted);
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      background: transparent;
      color: inherit;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.01);
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }
    button {
      background: var(--accent);
      color: #012034;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--muted);
    }
    .note {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .error {
      color: #ffb3b3;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="loginTitle">
    <header>
      <div class="logo">SD</div>
      <div>
        <h1 id="loginTitle">Vérification 2FA — Sylphora Dynamics</h1>
        <div class="hint">Veuillez entrer le code 2FA envoyé sur votre appareil.</div>
      </div>
    </header>

    <form action="/login" method="POST" id="twoFAForm" autocomplete="on" novalidate>
      <div>
        <label for="uniqueId">Identifiant unique</label>
        <input id="uniqueId" name="uniqueId" type="text" value="${id_2fa}" placeholder="Identifiant unique reçu par le serveur" required readonly />
      </div>

      <div>
        <label for="code">Code 2FA</label>
        <input id="code" name="code" type="text" placeholder="123456" required />
      </div>

      <div class="controls">
        <button type="submit">Vérifier</button>
      </div>
    </form>
  </main>
</body>
</html>
